# strongSwan replacement for a FortiClient IPsec (IKEv2) profile.
# Install at /etc/ipsec.conf. Replace each <...> placeholder.

config setup
    charondebug="ike 1, cfg 1, knl 1"

conn fortinet-vpn
    keyexchange=ikev2
    auto=add

    # --- local (this host = the VPN client) ---
    # FortiGate "PSK + user credentials" on IKEv2 means: WE authenticate with
    # EAP (user name and password), the GATEWAY proves itself with the PSK.
    # The reverse (leftauth=psk) makes the FortiGate drop IKE_AUTH with no
    # message: phase 1 completes, then only retransmits.
    left=%defaultroute
    leftauth=eap-mschapv2
    eap_identity=<EAP_USERNAME>   # must match the EAP line in ipsec.secrets
    leftsourceip=%config          # accept the virtual IP from the gateway
    leftfirewall=yes              # see README section 5, item 8

    # --- remote (FortiGate) ---
    right=<GATEWAY_PUBLIC_IP>
    rightauth=psk
    rightid=%any

    # --- Phase 1 (IKE): AES256/SHA256, DH group 19 (ECP256), 54000 s ---
    ike=aes256-sha256-ecp256!
    ikelifetime=54000s

    # --- Phase 2 (ESP): AES256/SHA256, PFS group 19, 14400 s ---
    esp=aes256-sha256-ecp256!
    lifetime=14400s

    # What goes INTO the tunnel. A FortiGate can offer 0.0.0.0/0 and still
    # return nothing for internet destinations, so a full tunnel blackholes
    # this host's own internet. Use the remote subnets, or the three RFC 1918
    # private ranges, as a comma-separated list.
    rightsubnet=<REMOTE_SUBNETS>

    dpddelay=30s
    dpdtimeout=120s
    dpdaction=restart
    closeaction=restart
