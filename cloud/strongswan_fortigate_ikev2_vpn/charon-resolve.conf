# /etc/strongswan.d/charon/resolve.conf  (only the `file` line differs from the default)
#
# Ubuntu confines charon with AppArmor (/etc/apparmor.d/usr.lib.ipsec.charon).
# The default target /etc/resolv.conf is a symlink into /run/systemd/resolve/,
# which the profile denies ("DENIED open /run/systemd/resolve/stub-resolv.conf")
# -> "adding DNS server failed" in the log.
# The profile permits /run/charon.* read-write, so point the plugin there. The
# pushed servers go into that file and are NOT applied to the system resolver.
resolve {
    file = /run/charon.resolv.conf
    load = yes
    resolvconf {
        # iface_prefix = lo.inet.ipsec.
    }
}
